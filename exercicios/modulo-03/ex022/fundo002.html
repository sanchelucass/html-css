<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização dos fundos</title>
    <style>
        body {

            /* no background image vc tambem pode usar imagens de alguma url */

            background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');

            /* background-size: cover; serve para cobrir todo o espaço disponível ja o background-repeat: no-repeat; serve para não repetir a imagem de fundo, ou seja, ela vai aparecer apenas uma vez.
               
            */

            background-size: 100px 100px;
            background-repeat: repeat-y;
        }
    </style>
</head>
<body> 
    <h1></h1>
</body>
</html>
